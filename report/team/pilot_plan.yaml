# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02); số từ src/ket_qua_lab13.txt
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 yêu cầu = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20/0,02 = 1.000 < 1.251: không đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6/0,02 = 300: không đạt, và chỉ 6 cụm.
#   e) Mức chênh 6 điểm: cần 859 quan sát hiệu dụng mỗi nhóm. Với 20 nhân viên,
#      m >= 299 yêu cầu/người, tức 5.980 yêu cầu thực tế mỗi nhóm; DE = 6,96,
#      cỡ mẫu hiệu dụng 5.980 / 6,96 ≈ 859,20 mỗi nhóm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code, seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: có thể chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng và ngày quyết định cần được chốt trong file này trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20.
#
# Đánh đổi đề xuất, chờ phê duyệt: mức chênh phát hiện được 6 điểm thay vì 5.
#   Nếu tác động thật chỉ +5 điểm thì power còn khoảng 0,64 (ước tính theo hướng dẫn lab). Giám đốc vận hành phải ký chấp nhận trước khi bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: hiện tại 51/1.200 = 4,25% (phạm vi noi_dia + hang_nang: 39/982 = 3,97%).
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng ngưỡng so với đối chứng (+2 điểm) kèm trần tuyệt đối 6%.

